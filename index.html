<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudyWindow</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Invisible drag region so the window is movable when UI is hidden -->
    <div id="drag-region"></div>
    <!-- Content root wraps backdrop + webview so we can set overall opacity -->
    <div id="content-root">
      <div id="projection-stage">
        <div id="projection-content">
          <!-- Backdrop tint layer (behind content) -->
          <div id="backdrop"></div>
          <webview id="content-frame" src="default-cloud.html" style="position:absolute;inset:0;will-change:transform;backface-visibility:hidden;transform:translateZ(0);" preload="./webview-preload.js" allowpopups></webview>
        </div>
      </div>
    <!-- Site CSS Editor Overlay -->
    <div id="sitecss-overlay" aria-hidden="true">
      <div class="sitecss-toolbar">
        <span class="title">Site CSS (site-css.json)</span>
        <div class="spacer"></div>
        <button id="sitecss-format" title="Format JSON">Format</button>
        <button id="sitecss-reload" title="Reload file">Reload</button>
        <button id="sitecss-save" title="Save">Save</button>
        <button id="sitecss-close" title="Close">×</button>
      </div>
      <textarea id="sitecss-editor" spellcheck="false"></textarea>
      <div id="sitecss-status"></div>
    </div>
    <div id="ui-container">
        <input type="text" id="url-input" placeholder="Enter URL or drop file">
        <button id="go-button" title="Go">➠</button>
        <button id="back-button" title="Back">‹</button>
        <button id="forward-button" title="Forward">›</button>
        <button id="reload-button" title="Reload">⟲</button>
        <button id="open-file-button" title="Open File">⍈</button>
        <button id="new-window-button" title="New Window">+</button>
        <button id="projection-button" title="Projection Mapping">⌗</button>
        <button id="toggle-ui-button" title="Hide UI">−</button>
        <button id="close-window-button" title="Close Window">×</button>
    </div>
      <!-- Drop overlay (appears during drag) -->
      <div id="drop-overlay"><div class="drop-hint">Drop file or URL</div></div>

      <!-- Frameless resize handles overlay -->
      <div id="resize-overlay">
        <div class="resize-handle edge top" id="resize-top"></div>
        <div class="resize-handle edge right" id="resize-right"></div>
        <div class="resize-handle edge bottom" id="resize-bottom"></div>
        <div class="resize-handle edge left" id="resize-left"></div>
        <div class="resize-handle corner top-left" id="resize-top-left"></div>
        <div class="resize-handle corner top-right" id="resize-top-right"></div>
        <div class="resize-handle corner bottom-right" id="resize-bottom-right"></div>
        <div class="resize-handle corner bottom-left" id="resize-bottom-left"></div>
      </div>
      <!-- Modifier drag overlay: hold Opt+Shift and drag anywhere to move window -->
      <div id="mod-drag-overlay" aria-hidden="true"></div>
      <!-- Frame flash overlay for quick orientation -->
      <div id="frame-flash"></div>
      <div id="projection-overlay" aria-hidden="true" tabindex="-1">
        <div id="projection-grid" aria-hidden="true"></div>
        <svg id="projection-wireframe" aria-hidden="true" preserveAspectRatio="none">
          <polygon id="projection-wire" points=""></polygon>
          <line id="projection-diagonal-a" x1="0" y1="0" x2="0" y2="0"></line>
          <line id="projection-diagonal-b" x1="0" y1="0" x2="0" y2="0"></line>
        </svg>
        <div class="projection-handle corner" data-index="0"></div>
        <div class="projection-handle corner" data-index="1"></div>
        <div class="projection-handle corner" data-index="2"></div>
        <div class="projection-handle corner" data-index="3"></div>
        <div class="projection-handle center" data-role="center"></div>
        <div id="projection-toolbar">
          <span class="title">Projection Mapping</span>
          <label class="projection-toggle"><input type="checkbox" id="projection-enabled-toggle"><span>Apply</span></label>
          <label class="projection-toggle"><input type="checkbox" id="projection-grid-toggle" checked><span>Grid</span></label>
          <button data-action="reset" title="Reset to window edges">Reset</button>
          <button data-action="cancel" title="Discard changes">Cancel</button>
          <button data-action="done" class="primary" title="Save changes">Done</button>
          <div class="spacer"></div>
          <div id="projection-toolbar-status"></div>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
</body>
</html>
